name: ForgePy CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CI tooling
        run: python -m pip install setuptools build

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q components cli templates core config builders models tests

      - name: Run packaging and support tests
        run: python -m unittest tests.test_packaging -v

      - name: Build wheel and sdist
        if: matrix.python-version == '3.12'
        run: python -m build

      - name: Inspect wheel and sdist
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          @'
          import email
          import tarfile
          import zipfile
          from pathlib import Path

          from config.version import VERSION

          dist_path = Path("dist")
          wheels = tuple(dist_path.glob("*.whl"))
          sdists = tuple(dist_path.glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          required_roots = {
              "main.py",
              "builders",
              "cli",
              "components",
              "config",
              "core",
              "models",
              "templates",
          }

          with zipfile.ZipFile(wheels[0]) as wheel:
              wheel_names = set(wheel.namelist())
              wheel_roots = {name.split("/", 1)[0] for name in wheel_names}
              assert required_roots <= wheel_roots, required_roots - wheel_roots
              assert "cli/commands/__init__.py" in wheel_names
              assert "tests" not in wheel_roots
              assert "utils" not in wheel_roots

              metadata_name = next(
                  name for name in wheel_names if name.endswith(".dist-info/METADATA")
              )
              metadata = email.message_from_bytes(wheel.read(metadata_name))
              assert metadata["Version"] == VERSION

              entry_points_name = next(
                  name
                  for name in wheel_names
                  if name.endswith(".dist-info/entry_points.txt")
              )
              entry_points = wheel.read(entry_points_name).decode("utf-8")
              assert "forgepy = main:main" in entry_points

          with tarfile.open(sdists[0], "r:gz") as sdist:
              sdist_names = set(sdist.getnames())
              relative_names = {
                  name.split("/", 1)[1]
                  for name in sdist_names
                  if "/" in name
              }
              sdist_roots = {
                  name.split("/", 1)[0] for name in relative_names
              }
              assert required_roots <= sdist_roots, required_roots - sdist_roots
              assert "pyproject.toml" in relative_names
              assert "cli/commands/__init__.py" in relative_names
              assert "tests" not in sdist_roots
              assert "utils" not in sdist_roots

              pkg_info_name = next(
                  name
                  for name in sdist_names
                  if name.count("/") == 1 and name.endswith("/PKG-INFO")
              )
              pkg_info = email.message_from_bytes(
                  sdist.extractfile(pkg_info_name).read()
              )
              assert pkg_info["Version"] == VERSION
          '@ | python -

      - name: Install wheel and validate installed CLI
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          $expectedVersion = python -c "from config.version import VERSION; print(VERSION)"
          $wheel = Get-ChildItem -Path dist -Filter *.whl -File -ErrorAction Stop
          if ($wheel.Count -ne 1) {
              throw "Expected exactly one wheel, found $($wheel.Count)."
          }

          $validationRoot = Join-Path $env:RUNNER_TEMP "forgepy-installed"
          python -m venv $validationRoot
          if ($LASTEXITCODE -ne 0) { throw "Failed to create validation environment." }

          $validationPython = Join-Path $validationRoot "Scripts/python.exe"
          $forgepy = Join-Path $validationRoot "Scripts/forgepy.exe"
          & $validationPython -m pip install $wheel.FullName --no-deps
          if ($LASTEXITCODE -ne 0) { throw "Failed to install built wheel." }

          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Push-Location $env:RUNNER_TEMP
          try {
              & $forgepy --help
              if ($LASTEXITCODE -ne 0) { throw "Installed help command failed." }

              $versionOutput = & $forgepy version
              if ($LASTEXITCODE -ne 0) { throw "Installed version command failed." }
              if ($versionOutput -notcontains "ForgePy v$expectedVersion") {
                  throw "Installed ForgePy reported an unexpected version."
              }

              & $forgepy list
              if ($LASTEXITCODE -ne 0) { throw "Installed list command failed." }

              & $forgepy component list
              if ($LASTEXITCODE -ne 0) { throw "Installed component list failed." }
          }
          finally {
              Pop-Location
          }
